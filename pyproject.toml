[project]
name = "hust-interface"
version = "0.1.0"
description = "High-performance Model Context Protocol (MCP) Server & Crawler for HUST services (eHUST, iCTSV, QLĐT, CTMS)"
readme = "README.md"
authors = [
    { name = "Ming2k8-Coder", email = "132853675+Ming2k8-Coder@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "browser-cookie3>=0.20.1",
    "click>=8.5.0",
    "h2>=4.4.1",
    "httpx[http2]>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.1.2",
    "mcp[cli]>=1.3.0",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "rookiepy>=0.5.6",
]

[project.scripts]
hust-mcp = "hust_interface.cli:main"


[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]
